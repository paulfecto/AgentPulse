upstream agentpulse_helper {
  server host.docker.internal:55110;
  keepalive 16;
}

map $http_upgrade $agentpulse_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location ^~ /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    try_files /manifest.webmanifest =404;
  }

  location = /icon.svg {
    root /usr/share/nginx/html;
    try_files /icon.svg =404;
  }

  location = /registerSW.js {
    root /usr/share/nginx/html;
    try_files /registerSW.js =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /sw.js {
    root /usr/share/nginx/html;
    try_files /sw.js =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    proxy_pass http://agentpulse_helper;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $agentpulse_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
