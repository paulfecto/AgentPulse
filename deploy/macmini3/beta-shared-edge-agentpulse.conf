# Reference snippet only. The live route is managed by
# scripts/macmini3/reconcile-agentpulse-shared-edge.sh.
# Include this in the existing beta.dope-ai.kr shared edge server block only for
# manual diagnostics. The public route is https://beta.dope-ai.kr/agent-pulse/.

# Agent Pulse beta app proxy BEGIN
location = /agent-pulse {
  return 308 /agent-pulse/;
}

location ^~ /agent-pulse/ {
  proxy_pass http://127.0.0.1:4355/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
# Agent Pulse beta app proxy END
